openapi:
  title: backend API
  version: 1.0.0
  description: API gerada automaticamente pelo Vaden.
  enable: true

drift:
  log_statements: true
postgres:
  host: localhost
  database: postgres
  port: 5432
  username: username
  password: password
  ssl: disable
server:
  port: 8080
  host: localhost

storage:
  provider: local  # opções: local, s3, firebase
  local:
    folder: './uploads'
  s3:
    bucket: 'meu-bucket'
    region: 'us-east-1'
    accessKey: 'sua_access_key'
    secretKey: 'seu_secret_key'
  firebase:
    projectId: 'my-project'
    apiKey: 'my_api'

env:
  base_url: http://localhost:8080
  # URL do frontend (Flutter Web) — usada só pra redirecionar de volta depois
  # do callback do login GitHub, o backend não serve esses arquivos.
  frontend_url: http://localhost:5050
  mode: debug

security:
  secret: 'troque-este-segredo-em-producao'  # via env var em produção
  tokenValidity: 900        # 15 min, em segundos
  refreshTokenValidity: 604800   # 7 dias, em segundos
  issuer: dartisan
  # dart_jsonwebtoken exige lista não-vazia (Audience assert) — não deixar [].
  audiences: ['dartisan-api']
  github:
    # Criar em https://github.com/settings/developers — Authorization callback
    # URL precisa ser exatamente "{base_url}/api/auth/github/callback".
    # NUNCA commitar valores reais aqui — preencha só localmente ou via
    # variável de ambiente em produção.
    client_id: ''      # via env var GITHUB_CLIENT_ID em produção
    client_secret: ''  # via env var GITHUB_CLIENT_SECRET em produção

publish:
  max_tarball_size_bytes: 104857600  # 100 MiB, mesma ordem de grandeza do pub.dev